server:
  port: 8080

spring:
  application:
    name: justbuy-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/justbuy-db;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

bitman:
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    grok-api-key: ${XAI_API_KEY:}
  dart:
    api-key: ${DART_API_KEY:}
  kis:
    app-key: ${BITMAN_KIS_APP_KEY:}
    app-secret: ${BITMAN_KIS_APP_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://localhost:5173,https://bitman-justbuy.pages.dev,https://crop-mens-street-kai.trycloudflare.com}
  storage:
    data-dir: ${STORAGE_DIR:./data}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${ADMIN_EMAIL:}
