server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  # Graceful shutdown: in-flight 요청 완료까지 대기 (systemd SIGTERM 호환).
  shutdown: graceful

spring:
  application:
    name: justbuy-api
  # 프로파일 기본은 dev. prod 전환: --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # 기본값: H2 파일 DB (로컬 dev). prod 프로파일에서 override.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/justbuy-db;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      # dev 에서만 true 허용. prod 프로파일에서 강제 false + SecurityConfig 차단.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      # dev: update (스키마 자동 반영). prod: validate (DDL 변경 차단).
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    baseline-on-migrate: true

bitman:
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    grok-api-key: ${XAI_API_KEY:}
    gemini-api-key: ${GOOGLE_API_KEY:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    deepseek-model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  dart:
    api-key: ${DART_API_KEY:}
  kis:
    app-key: ${BITMAN_KIS_APP_KEY:}
    app-secret: ${BITMAN_KIS_APP_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://localhost:5173,https://bitman-justbuy.pages.dev,https://production.bitman-justbuy.pages.dev,https://api.bit-man.net}
  storage:
    data-dir: ${STORAGE_DIR:./data}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
  short-term:
    realtime:
      enabled: ${BITMAN_SHORT_TERM_REALTIME_ENABLED:true}
      interval-ms: ${BITMAN_SHORT_TERM_REALTIME_INTERVAL_MS:180000}
      initial-delay-ms: ${BITMAN_SHORT_TERM_REALTIME_INITIAL_DELAY_MS:45000}
      fresh-ttl-ms: ${BITMAN_SHORT_TERM_REALTIME_FRESH_TTL_MS:240000}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    channel-chat-id: ${TELEGRAM_CHANNEL_CHAT_ID:}
  jwt:
    # JWT_SECRET: prod 에서는 필수 (JwtService 가 기동 차단).
    #             dev 에서는 미설정 시 data/.jwt-secret 자동 영속화.
    #             생성: openssl rand -base64 64
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000}
  flask:
    base-url: ${FLASK_BASE_URL:http://localhost:5001}
  admin:
    email: ${ADMIN_EMAIL:admin@bitman.net}
  backup:
    # JAR cwd = backend/, ../backups → C:\bitman_justbuy_project\backups\ (PS aux 와 동일 위치)
    # retention 통일을 위해 양쪽 도구가 같은 디렉토리에 쓰도록 강제.
    enabled: ${BITMAN_BACKUP_ENABLED:true}
    dir: ${BITMAN_BACKUP_DIR:../backups}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
